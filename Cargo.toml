[workspace]
resolver = "2"
members = [
    "crates/squish-core",
    "crates/squish-cli",
    "crates/squish-video",
    "crates/squish-audio",
    "crates/squish-code",
    "crates/squish-media",
]

[workspace.package]
version = "0.10.1"
edition = "2021"
rust-version = "1.95"
license = "MIT"
description = "Local CLI to compress images, video, audio, and minify code"
homepage = "https://github.com/MikeDre/squish"
repository = "https://github.com/MikeDre/squish"
readme = "README.md"
keywords = ["image", "compression", "cli", "optimise", "jpg"]
categories = ["command-line-utilities", "multimedia::images"]

[workspace.dependencies]
thiserror = "2.0"
squish-core = { version = "0.10.1", path = "crates/squish-core" }
squish-video = { version = "0.10.1", path = "crates/squish-video" }
squish-audio = { version = "0.10.1", path = "crates/squish-audio" }
squish-code = { version = "0.10.1", path = "crates/squish-code" }
squish-media = { version = "0.10.1", path = "crates/squish-media" }
