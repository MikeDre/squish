name: Release

# Builds prebuilt `squish` binaries for every supported platform when a
# version tag (v*) is pushed, and attaches them to the GitHub release.
#
# Note: binaries dynamically link libheif and dav1d (HEIC/AVIF support).
# macOS users get them via the Homebrew formula's dependencies; Linux users
# need `apt install libheif1 libdav1d-dev`-equivalents at runtime. gifsicle
# and ffmpeg remain runtime subprocess dependencies as documented in the
# README.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create release if absent
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes

  build:
    name: Build ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install libheif dav1d nasm pkg-config

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libdav1d-dev nasm pkg-config cmake libde265-dev libx265-dev libjpeg-dev zlib1g-dev
          # Ubuntu's libheif-dev (1.17.x) is older than libheif-sys's >=1.18
          # requirement, so build libheif from source.
          git clone --depth 1 --branch v1.23.0 https://github.com/strukturag/libheif.git /tmp/libheif
          cmake -S /tmp/libheif -B /tmp/libheif/build -DCMAKE_BUILD_TYPE=Release -DWITH_EXAMPLES=OFF -DBUILD_TESTING=OFF
          cmake --build /tmp/libheif/build -j"$(nproc)"
          sudo cmake --install /tmp/libheif/build
          sudo ldconfig

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release -p squish-media-cli

      - name: Generate man page
        run: target/release/squish man > target/release/squish.1

      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          archive="squish-v${version}-${{ matrix.target }}.tar.gz"
          tar -czf "$archive" -C target/release squish squish.1
          shasum -a 256 "$archive" > "$archive.sha256"

      - name: Upload artifacts to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" squish-v*.tar.gz squish-v*.tar.gz.sha256 --clobber

  # Point the Homebrew tap at the release that was just published.
  #
  # This used to be a manual `scripts/release-tap.sh` run, which meant a release
  # could ship binaries with the tap left on the previous version — `brew install
  # squish` would then quietly serve an old build. `needs: build` covers the whole
  # matrix, so the formula is only ever rewritten once all four archives exist.
  tap:
    name: Update Homebrew tap
    needs: build
    runs-on: ubuntu-latest
    # Forks have neither the tap nor the secret; failing their releases would be
    # noise, not a signal.
    if: github.repository == 'MikeDre/squish'
    steps:
      - uses: actions/checkout@v7

      - name: Check for the tap token
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is not set, so the tap cannot be updated." \
                 "Create a fine-grained PAT with Contents:write on MikeDre/homebrew-tap" \
                 "and add it as a repository secret, then re-run this job." \
                 "Until then, run scripts/release-tap.sh $GITHUB_REF_NAME by hand."
            exit 1
          fi

      # A separate checkout, not the default token: github.token is scoped to this
      # repository and cannot push to the tap.
      - name: Check out the tap
        uses: actions/checkout@v7
        with:
          repository: MikeDre/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update the formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release-tap.sh "$GITHUB_REF_NAME" homebrew-tap

      - name: Verify the formula matches the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -q "^  version \"$version\"\$" homebrew-tap/Formula/squish.rb; then
            echo "::error::the tap formula does not declare version $version after the update"
            grep -n 'version' homebrew-tap/Formula/squish.rb
            exit 1
          fi
          echo "Homebrew tap now serves squish $version."
