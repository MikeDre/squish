name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install libheif dav1d ffmpeg gifsicle nasm pkg-config

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # fontconfig (the /etc/fonts/*.conf files, not just the library) is what
          # lets fontdb resolve the generic "serif"/"sans-serif" families to an
          # installed font. This runner has real font files (fonts-dejavu-core) but
          # no fontconfig config, so fontdb falls back to its hardcoded "Times New
          # Roman"/"Arial" defaults, which don't match any installed family. usvg's
          # own text-layout fallback also asks for generic Serif, so it fails too
          # and silently drops the <text> node instead of rendering it — which is
          # why warns_about_a_font_this_machine_cannot_supply saw zero warnings.
          sudo apt-get install -y libdav1d-dev ffmpeg gifsicle nasm pkg-config cmake libde265-dev libx265-dev libjpeg-dev zlib1g-dev fonts-dejavu-core fontconfig

      - name: Cache source-built libheif (Linux)
        if: runner.os == 'Linux'
        id: libheif-cache
        uses: actions/cache@v6
        with:
          path: /tmp/libheif-install
          key: libheif-v1.23.0-${{ runner.os }}-${{ runner.arch }}

      - name: Build libheif from source (Linux)
        if: runner.os == 'Linux' && steps.libheif-cache.outputs.cache-hit != 'true'
        run: |
          # Ubuntu's libheif-dev (1.17.x) is older than libheif-sys's >=1.18
          # requirement, so build from source into a cacheable prefix.
          git clone --depth 1 --branch v1.23.0 https://github.com/strukturag/libheif.git /tmp/libheif
          cmake -S /tmp/libheif -B /tmp/libheif/build -DCMAKE_BUILD_TYPE=Release \
            -DWITH_EXAMPLES=OFF -DBUILD_TESTING=OFF -DCMAKE_INSTALL_PREFIX=/tmp/libheif-install
          cmake --build /tmp/libheif/build -j"$(nproc)"
          cmake --install /tmp/libheif/build

      - name: Install cached libheif (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo cp -r /tmp/libheif-install/* /usr/local/
          sudo ldconfig

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace

  install:
    name: cargo install (--locked path + drift check)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdav1d-dev nasm pkg-config cmake libde265-dev libx265-dev libjpeg-dev zlib1g-dev

      - name: Cache source-built libheif
        id: libheif-cache
        uses: actions/cache@v6
        with:
          path: /tmp/libheif-install
          key: libheif-v1.23.0-${{ runner.os }}-${{ runner.arch }}

      - name: Build libheif from source
        if: steps.libheif-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v1.23.0 https://github.com/strukturag/libheif.git /tmp/libheif
          cmake -S /tmp/libheif -B /tmp/libheif/build -DCMAKE_BUILD_TYPE=Release \
            -DWITH_EXAMPLES=OFF -DBUILD_TESTING=OFF -DCMAKE_INSTALL_PREFIX=/tmp/libheif-install
          cmake --build /tmp/libheif/build -j"$(nproc)"
          cmake --install /tmp/libheif/build

      - name: Install cached libheif
        run: |
          sudo cp -r /tmp/libheif-install/* /usr/local/
          sudo ldconfig

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Verifies the exact command the README and website tell users to run.
      # This is the supported install path and must always succeed.
      - name: cargo install --locked (documented install path)
        run: cargo install --path crates/squish-cli --locked --force

      # Non-blocking. Mirrors a bare `cargo install squish-media-cli` by
      # re-resolving every transitive dependency to its newest compatible
      # version. The lightningcss/minify-html/oxvg `=` pins that used to make
      # this fail unconditionally are gone (Brief 16), so it currently passes —
      # kept non-blocking still, since any transitive crate's release could
      # break a fresh resolve for reasons `--locked` (the documented install
      # path) is immune to.
      - name: Fresh-resolve drift check (informational, non-blocking)
        continue-on-error: true
        run: |
          cargo update
          cargo build -p squish-media-cli

  lint:
    name: Clippy + rustfmt
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdav1d-dev nasm pkg-config cmake libde265-dev libx265-dev libjpeg-dev zlib1g-dev

      - name: Cache source-built libheif
        id: libheif-cache
        uses: actions/cache@v6
        with:
          path: /tmp/libheif-install
          key: libheif-v1.23.0-${{ runner.os }}-${{ runner.arch }}

      - name: Build libheif from source
        if: steps.libheif-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v1.23.0 https://github.com/strukturag/libheif.git /tmp/libheif
          cmake -S /tmp/libheif -B /tmp/libheif/build -DCMAKE_BUILD_TYPE=Release \
            -DWITH_EXAMPLES=OFF -DBUILD_TESTING=OFF -DCMAKE_INSTALL_PREFIX=/tmp/libheif-install
          cmake --build /tmp/libheif/build -j"$(nproc)"
          cmake --install /tmp/libheif/build

      - name: Install cached libheif
        run: |
          sudo cp -r /tmp/libheif-install/* /usr/local/
          sudo ldconfig

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: rustfmt
        run: cargo fmt --check

  msrv:
    name: MSRV (1.95)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdav1d-dev nasm pkg-config cmake libde265-dev libx265-dev libjpeg-dev zlib1g-dev

      - name: Cache source-built libheif
        id: libheif-cache
        uses: actions/cache@v6
        with:
          path: /tmp/libheif-install
          key: libheif-v1.23.0-${{ runner.os }}-${{ runner.arch }}

      - name: Build libheif from source
        if: steps.libheif-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch v1.23.0 https://github.com/strukturag/libheif.git /tmp/libheif
          cmake -S /tmp/libheif -B /tmp/libheif/build -DCMAKE_BUILD_TYPE=Release \
            -DWITH_EXAMPLES=OFF -DBUILD_TESTING=OFF -DCMAKE_INSTALL_PREFIX=/tmp/libheif-install
          cmake --build /tmp/libheif/build -j"$(nproc)"
          cmake --install /tmp/libheif/build

      - name: Install cached libheif
        run: |
          sudo cp -r /tmp/libheif-install/* /usr/local/
          sudo ldconfig

      - uses: dtolnay/rust-toolchain@1.95

      - uses: Swatinem/rust-cache@v2

      - name: cargo check
        run: cargo check --workspace

  supply-chain:
    name: Supply chain (cargo-deny)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: EmbarkStudios/cargo-deny-action@v2
