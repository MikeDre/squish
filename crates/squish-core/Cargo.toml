[package]
name = "squish-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
description = "Core image compression library for squish"
exclude = ["tests/**"]

[dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "avif", "avif-native", "tiff", "gif"] }
imagequant = "4"
libheif-rs = "1.0"
mozjpeg = "0.10"
oxipng = { version = "9", default-features = false, features = ["parallel"] }
oxvg = "0.0.7"
oxvg_ast = "0.0.7"
oxvg_optimiser = "0.0.7"
ravif = "0.11"
resvg = "0.48"
roxmltree = "0.21"
ssimulacra2 = "0.5"
thiserror.workspace = true
webp = "0.3"

[dev-dependencies]
tempfile = "3"
