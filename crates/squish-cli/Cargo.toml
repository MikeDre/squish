[package]
name = "squish-media-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
description = "Local CLI to compress images, video, audio, and minify code"

[[bin]]
name = "squish"
path = "src/main.rs"

[dependencies]
squish-core.workspace = true
squish-video = { workspace = true }
squish-audio = { workspace = true }
squish-code = { workspace = true }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "5"
humantime = "2"
indicatif = "0.17"
notify = "8"
notify-debouncer-mini = "0.7"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
walkdir = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
