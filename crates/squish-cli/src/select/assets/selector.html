<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>squish — select crop</title>
<style>__SQUISH_CSS__</style>
<header id="bar">
  <span id="file"></span>
  <span id="source"></span>
  <span id="ratios">
    <button type="button" data-r="free">Free</button>
    <button type="button" data-r="1:1">1:1</button>
    <button type="button" data-r="4:3">4:3</button>
    <button type="button" data-r="16:9">16:9</button>
    <button type="button" data-r="9:16">9:16</button>
    <button type="button" data-r="orig">Original</button>
  </span>
</header>
<main id="stage">
  <img id="preview" alt="" draggable="false">
  <div id="shade"></div>
  <div id="sel">
    <i class="h" data-h="nw"></i><i class="h" data-h="n"></i><i class="h" data-h="ne"></i>
    <i class="h" data-h="w"></i><i class="h" data-h="e"></i>
    <i class="h" data-h="sw"></i><i class="h" data-h="s"></i><i class="h" data-h="se"></i>
    <div id="readout"><strong id="size"></strong><span id="meta"></span></div>
  </div>
  <div id="overlay">
    <div id="card">
      <div id="card-icon"></div>
      <h1 id="card-title"></h1>
      <div id="progress" hidden><i></i></div>
      <div id="card-detail"></div>
      <p id="card-foot"></p>
    </div>
  </div>
</main>
<footer id="hint">
  drag to select · ⏎ crop · esc cancel
  <button id="help" type="button" aria-expanded="false" aria-controls="keys" title="Keyboard shortcuts">?</button>
  <span id="estimate">—</span>
  <span id="zoom">
    <button type="button" data-z="fit">Fit</button>
    <button type="button" data-z="0.5">50%</button>
    <button type="button" data-z="1">100%</button>
  </span>
  <span id="actions">
    <button id="cancel" type="button">Cancel</button>
    <button id="crop" type="button">Crop</button>
  </span>
</footer>
<div id="keys" hidden>
  <kbd>drag</kbd><span>select a region</span>
  <kbd>drag inside</kbd><span>move the selection</span>
  <kbd>⇧ + drag</kbd><span>lock the ratio</span>
  <kbd>arrows</kbd><span>nudge (⇧ for 10px)</span>
  <kbd>⌥ + arrows</kbd><span>resize</span>
  <kbd>⌘/ctrl + wheel</kbd><span>zoom</span>
  <kbd>space + drag</kbd><span>pan</span>
  <kbd>⏎</kbd><span>crop</span>
  <kbd>esc</kbd><span>cancel</span>
</div>
<script>window.__SQUISH__ = __SQUISH_CONFIG__;</script>
<script>__SQUISH_JS__</script>
