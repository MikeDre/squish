[graph]
targets = []

[advisories]
version = 2
ignore = [
    # No safe upgrade available (crate archived/unmaintained, or upstream hasn't
    # moved yet); transitive only.
    "RUSTSEC-2024-0436", # paste, via oxvg_ast (Brief 16's `=` pins are gone as of
                         # oxvg 0.0.7, but oxvg_ast itself still depends on paste)
    "RUSTSEC-2026-0235", # rkyv 0.7, via parcel_sourcemap <- lightningcss's
                         # "bundler"/"sourcemap" feature, forced on by minify-html
                         # hardcoding `default-features = true` on its own
                         # lightningcss dependency. parcel_sourcemap 2.1.1 (latest)
                         # still requires rkyv ^0.7.38; no fix until it moves to 0.8.
]

[licenses]
version = 2
allow = [
    "MIT",
    "MIT-0",    # borrow-or-share, via oxvg's tower-lsp-server dep — permissive, no attribution required
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "IJG",      # mozjpeg/mozjpeg-sys — permissive Independent JPEG Group license
    "NCSA",     # libfuzzer-sys (rav1e's optional fuzzing dep, not compiled in) — permissive
    "CC0-1.0",  # notify/notify-debouncer-mini — public-domain equivalent
]

# imagequant is GPL-3.0-or-later, pulled in directly by squish-core for
# palette quantization. This predates this CI job and conflicts with
# squish's MIT license — flagged for follow-up, not silently allowed
# workspace-wide. See https://github.com/MikeDre/squish/issues (file one).
[[licenses.exceptions]]
allow = ["GPL-3.0-or-later"]
name = "imagequant"

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
