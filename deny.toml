[graph]
targets = []

[advisories]
version = 2
ignore = [
    # No safe upgrade available (crate archived/unmaintained); transitive only.
    "RUSTSEC-2025-0057", # fxhash, via oxvg's selectors dep
    "RUSTSEC-2025-0119", # number_prefix, via indicatif's progress-bar formatting
    "RUSTSEC-2024-0436", # paste, via lightningcss/oxvg — tied to the `=`-pinned
                         # lightningcss/minify-html versions in squish-code;
                         # revisit alongside Brief 16 (IMPLEMENTATION-BRIEFS.md)
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "MPL-2.0",
    "IJG",      # mozjpeg/mozjpeg-sys — permissive Independent JPEG Group license
    "NCSA",     # libfuzzer-sys (rav1e's optional fuzzing dep, not compiled in) — permissive
    "CC0-1.0",  # notify/notify-debouncer-mini — public-domain equivalent
]

# imagequant is GPL-3.0-or-later, pulled in directly by squish-core for
# palette quantization. This predates this CI job and conflicts with
# squish's MIT license — flagged for follow-up, not silently allowed
# workspace-wide. See https://github.com/MikeDre/squish/issues (file one).
[[licenses.exceptions]]
allow = ["GPL-3.0-or-later"]
name = "imagequant"

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
